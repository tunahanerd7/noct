<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noct · Open in the app</title>
<meta property="og:title" content="See it on Noct">
<meta property="og:description" content="Events, plans and who's going tonight. Open in the Noct app.">
<meta property="og:type" content="website">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 80% at 80% 0%,#3a1450 0%,#0b0b10 60%);color:#ececf1;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:420px;padding:32px 20px;text-align:center}
.logo{font-size:52px;font-weight:900;letter-spacing:-1px;margin:0;background:linear-gradient(90deg,#7b5cff,#c04dfd,#ff5ea3);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:#a4a4b4;font-size:15px;margin:6px 0 28px}
.btn{display:block;width:100%;padding:16px;border-radius:16px;font-weight:700;font-size:17px;text-decoration:none;margin:12px 0}
.primary{background:linear-gradient(90deg,#7b5cff,#c04dfd,#ff5ea3);color:#fff}
.secondary{background:#1c1c27;color:#ececf1}
small{color:#6f6f7e}</style></head>
<body><main>
<p class="logo">Noct</p>
<p class="muted" id="msg">Opening in the Noct app…</p>
<a class="btn primary" id="open" href="#">Open in Noct</a>
<a class="btn secondary" id="get" href="index.html">Get Noct</a>
<small>Don't have the app yet? Download it, then tap this link again.</small>
</main>
<script>
(function(){
  var q = new URLSearchParams(location.search), t = q.get('t'), v = q.get('v') || '', id = q.get('id') || '';
  var enc = encodeURIComponent, deep = null;
  if (t === 'v' && v) deep = 'noct://v/' + enc(v);
  if (t === 'e' && v && id) deep = 'noct://e/' + enc(v) + '/' + enc(id);
  if (t === 'p' && id) deep = 'noct://p/' + enc(id);
  var tr = (navigator.language || '').toLowerCase().indexOf('tr') === 0;
  if (tr) {
    document.documentElement.lang = 'tr';
    document.getElementById('msg').textContent = 'Noct uygulamasında açılıyor…';
    document.getElementById('open').textContent = "Noct'ta aç";
    document.getElementById('get').textContent = "Noct'u indir";
    document.querySelector('small').textContent = 'Uygulama yüklü değil mi? İndir, sonra bu linke tekrar dokun.';
  }
  if (deep) {
    document.getElementById('open').href = deep;
    setTimeout(function(){ location.href = deep; }, 300);
  } else {
    document.getElementById('open').style.display = 'none';
  }
})();
</script>
</body></html>
