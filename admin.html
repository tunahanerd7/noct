<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Noct · Yönetim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f8;--card:#ffffff;--soft:#f2f1f7;--line:#e6e5ee;--text:#16151d;--muted:#6e6c7c;
  --acc:#7c3aed;--acc2:#db2777;--accSoft:#f3edff;--ok:#16a34a;--okSoft:#e8f7ee;--bad:#dc2626;--badSoft:#fdecec;--warn:#d97706;--warnSoft:#fff4e0;
  --shadow:0 1px 2px rgba(20,18,40,.04),0 4px 14px rgba(20,18,40,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit}
.grad{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* yerleşim */
.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:baseline;gap:8px;padding:4px 10px 18px}
.brand b{font-size:26px;font-weight:800;letter-spacing:-.6px}
.brand span{color:var(--muted);font-size:12px;font-weight:600}
.navgroup{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:16px 10px 6px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--text);padding:8px 10px;border-radius:10px;cursor:pointer;font-weight:500;text-align:left}
.navbtn:hover{background:var(--soft)}
.navbtn.on{background:var(--accSoft);color:var(--acc);font-weight:700}
.navbtn .ic{width:20px;text-align:center;font-size:15px}
.navbtn .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 7px;line-height:19px}
.content{min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 28px;background:rgba(245,245,248,.9);backdrop-filter:blur(8px);position:sticky;top:0;z-index:4;border-bottom:1px solid var(--line)}
.topbar h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.3px}
.topbar .sp{flex:1}
.topbar .who{color:var(--muted);font-size:13px}
main{padding:22px 28px 80px;max-width:1280px}
.mobilenav{display:none}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  aside{display:none}
  .mobilenav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:57px;z-index:4}
  .mobilenav button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer}
  .mobilenav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .topbar{padding:12px 16px}
  main{padding:16px 16px 80px}
  .topbar .who{display:none}
}

/* bileşenler */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);cursor:default}
.stat.link{cursor:pointer}.stat.link:hover{border-color:var(--acc)}
.stat .l{color:var(--muted);font-size:12px;font-weight:600}
.stat .v{font-size:28px;font-weight:800;letter-spacing:-.6px;margin-top:2px}
.stat .s{color:var(--muted);font-size:12px}
.stat.alert{border-color:#fbcfe8;background:linear-gradient(180deg,#fff,#fff7fb)}
.stat.alert .v{color:var(--acc2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
h2{font-size:16px;margin:0 0 12px;font-weight:700}
h3{font-size:12px;margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.muted{color:var(--muted);font-size:13px}
.title{font-weight:700;font-size:15px}
.row{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.grow{flex:1;min-width:200px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;font-size:13.5px;margin-top:8px}
.kv b{color:var(--muted);font-weight:500}
.chip{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:0 9px;font-size:12px;line-height:20px;margin:2px 4px 2px 0;font-weight:500;color:var(--text)}
.seal{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none;background:conic-gradient(from 200deg,#7a5cff,#bf4dfc,#ff5ea3,#7a5cff);
  box-shadow:0 0 0 3px #fff inset,0 0 0 5px rgba(122,92,255,.35) inset,0 4px 10px rgba(0,0,0,.18);transform:rotate(-8deg);margin-right:12px}
.seal-disc{width:80%;height:80%;border-radius:50%;display:flex;align-items:center;justify-content:center;transform:rotate(8deg);font-size:10px;color:#999;overflow:hidden;outline:2px dashed rgba(255,255,255,.9);outline-offset:2px}
.seal-disc img{width:76%;height:76%;object-fit:contain}
.chip.p{background:var(--accSoft);border-color:#ddd0fb;color:var(--acc)}
.chip.ok{background:var(--okSoft);border-color:#c6ecd3;color:var(--ok)}
.chip.bad{background:var(--badSoft);border-color:#f8c9c9;color:var(--bad)}
.chip.warn{background:var(--warnSoft);border-color:#fbe0b0;color:var(--warn)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.b{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:7px 13px;font-weight:600;cursor:pointer;font-size:13px;white-space:nowrap}
.b:hover{border-color:#cfcde0}
.b.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.b.bad{background:var(--card);border-color:#f3b4b4;color:var(--bad)}
.b.bad:hover{background:var(--badSoft)}
.b.acc{background:linear-gradient(90deg,var(--acc),var(--acc2));border:0;color:#fff}
.b.sm{padding:4px 10px;font-size:12px;border-radius:8px}
.b:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #e5dbff;border-color:var(--acc)}
select.auto{width:auto}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px;font-weight:600}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:12px;background:var(--soft);cursor:zoom-in;border:1px solid var(--line)}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--soft);border:1px solid var(--line);flex:none}
.av.lg{width:72px;height:72px}
.avph{width:36px;height:36px;border-radius:50%;background:var(--accSoft);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.empty{color:var(--muted);text-align:center;padding:36px 0}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar input{max-width:340px}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

/* tablo */
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 12px;background:#fafafc;border-bottom:1px solid var(--line);font-weight:700}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#faf8ff}
.tblwrap{overflow-x:auto;border-radius:16px}
.who-cell{display:flex;align-items:center;gap:10px}
.feat{border-color:#c9b5f8;box-shadow:0 0 0 1px rgba(124,58,237,.18),0 6px 18px rgba(124,58,237,.10)}

/* galeri */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.tile img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--soft);cursor:zoom-in}
.tile .tb{padding:8px 10px}

/* grafik */
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;max-width:28px;background:linear-gradient(180deg,var(--acc),var(--acc2));border-radius:6px 6px 2px 2px;min-height:2px}
.bar span{font-size:10px;color:var(--muted)}
.bar em{font-style:normal;font-size:11px;font-weight:700}

/* çekmece */
.drawer-bg{position:fixed;inset:0;background:rgba(20,18,40,.35);z-index:20;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--bg);z-index:21;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(20,18,40,.12)}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--card);border-bottom:1px solid var(--line)}
.drawer header b{font-size:16px}
.drawer .body{padding:16px 18px 60px;overflow-y:auto}
.x{margin-left:auto;border:0;background:var(--soft);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16151d;color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:40;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
.zoom img{max-width:94vw;max-height:94vh;border-radius:12px}
.login{max-width:400px;margin:12vh auto;padding:0 16px}
.login .card{padding:28px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--soft);padding:12px;border-radius:10px;font-size:12px;border:1px solid var(--line)}
.loading{color:var(--muted);padding:24px 0;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div class="drawer-bg" id="dbg"></div>
<div class="drawer" id="drawer"><header><b id="dTitle"></b><button class="x" id="dClose">✕</button></header><div class="body" id="dBody"></div></div>
<div class="toast" id="toast"></div>
<div class="zoom" id="zoom"><img id="zoomImg" alt=""></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, collection, query, where, orderBy, limit, startAfter, documentId, serverTimestamp, deleteField, arrayUnion, arrayRemove, Timestamp, getCountFromServer, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase web ayarı. Gizli bilgi değildir: güvenliği Firestore kuralları sağlar (sadece admins listesindekiler yönetebilir).
const firebaseConfig = {
  apiKey: "AIzaSyDutWy1ZkjkuysJm9JqTQvpzGR59yiGJ88",
  authDomain: "auraapp-75d0c.firebaseapp.com",
  projectId: "auraapp-75d0c",
  storageBucket: "auraapp-75d0c.firebasestorage.app",
  messagingSenderId: "360997024792",
  appId: "1:360997024792:ios:f6e070529f52bac9ae3f6d"
};
const PUSH = "https://noct-push.tunahanerd7.workers.dev/";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ================= yardımcılar =================
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uuid = () => crypto.randomUUID().toUpperCase();
const toDate = (t) => { if (!t) return null; if (t.toDate) return t.toDate(); const d = new Date(t); return isNaN(d) ? null : d; };
const fmt = (t) => { const d = toDate(t); return d ? d.toLocaleString("tr-TR", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "—"; };
const fmtDay = (t) => { const d = toDate(t); return d ? d.toLocaleDateString("tr-TR", { day: "2-digit", month: "short", year: "numeric" }) : "—"; };
const ago = (t) => {
  const d = toDate(t); if (!d) return "—";
  const s = (Date.now() - d) / 1000;
  if (s < 0) return fmt(t);
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + " dk önce";
  if (s < 86400) return Math.round(s / 3600) + " sa önce";
  if (s < 86400 * 30) return Math.round(s / 86400) + " gün önce";
  return fmtDay(t);
};
const daysLeft = (t) => { const d = toDate(t); return d ? Math.max(0, Math.ceil((d - Date.now()) / 864e5)) : 0; };
const isFuture = (t) => { const d = toDate(t); return !!d && d > new Date(); };
const src = (b64) => !b64 ? "" : (b64.startsWith("data:") || b64.startsWith("http") ? b64 : "data:image/jpeg;base64," + b64);
const img = (b64, cls = "thumb") => b64 ? `<img class="${cls}" src="${esc(src(b64))}" data-zoom alt="">` : "";
const avatar = (u, lg) => u && u.profileImgBase64 ? `<img class="av ${lg ? "lg" : ""}" src="${esc(src(u.profileImgBase64))}" data-zoom alt="">` : `<div class="avph" ${lg ? 'style="width:72px;height:72px;font-size:26px"' : ""}>${esc(((u && u.username) || "?").slice(0, 1).toUpperCase())}</div>`;
const mapLink = (lat, lon) => (lat || lon) ? `<a target="_blank" rel="noopener" href="https://maps.apple.com/?ll=${lat},${lon}&q=${lat},${lon}">Harita</a>` : "";
const place = (b) => [b.district, b.province, b.country].filter(Boolean).join(", ");
const trLower = (s) => String(s || "").toLocaleLowerCase("tr");
const docs = (s) => s.docs.map((d) => ({ ...d.data(), id: d.id }));
function toast(msg, ms = 2600) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = "none"), ms); }
async function guard(btn, fn) {
  if (btn) btn.disabled = true;
  try { await fn(); } catch (e) { console.error(e); toast("Hata: " + (e.message || e), 5000); }
  finally { if (btn && btn.isConnected) btn.disabled = false; }
}
document.addEventListener("click", (e) => {
  const z = e.target.closest("[data-zoom]");
  if (z) { e.stopPropagation(); $("#zoomImg").src = z.src; $("#zoom").style.display = "flex"; }
}, true);
$("#zoom").onclick = () => ($("#zoom").style.display = "none");
async function notify(type, ref) {
  try {
    const t = await auth.currentUser.getIdToken();
    await fetch(PUSH, { method: "POST", headers: { Authorization: "Bearer " + t, "Content-Type": "application/json" }, body: JSON.stringify({ type, to: [], ref }) });
  } catch (e) { console.warn("bildirim gönderilemedi", e); }
}
async function areaOf(lat, lon) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&accept-language=tr&lat=${lat}&lon=${lon}`);
    const a = (await r.json()).address || {};
    const province = (a.province || a.state || a.city || "").replace(/ İli$/, "");
    if (!province) return null;
    return { country: a.country || "", province, district: a.town || a.county || a.city_district || a.municipality || a.suburb || province };
  } catch { return null; }
}
const userCache = {};
async function userOf(uid) {
  if (!uid) return null;
  if (!(uid in userCache)) { try { const s = await getDoc(doc(db, "users", uid)); userCache[uid] = s.exists() ? { ...s.data(), id: uid } : null; } catch { userCache[uid] = null; } }
  return userCache[uid];
}
function fillUsers(root) {
  root.querySelectorAll("[data-uname]").forEach(async (s) => {
    const u = await userOf(s.dataset.uname);
    s.textContent = u ? "@" + (u.username || "?") : (s.dataset.uname ? "silinmiş hesap" : "—");
    if (u) { s.classList.add("ulink"); s.style.cursor = "pointer"; s.style.color = "var(--acc)"; s.onclick = (e) => { e.stopPropagation(); openUser(u.id); }; }
  });
}
async function presenceOf(ids) {
  const out = {};
  for (let i = 0; i < ids.length; i += 10) {
    const chunk = ids.slice(i, i + 10); if (!chunk.length) continue;
    try { const s = await getDocs(query(collection(db, "presence"), where(documentId(), "in", chunk))); s.docs.forEach((d) => (out[d.id] = d.data())); } catch {}
  }
  return out;
}
const uname = (uid) => `<span data-uname="${esc(uid || "")}">…</span>`;
function newBusiness({ id, ownerId = "", uniqueMapId = "", name, type = "Venue", lat = 0, lon = 0, address = "", tags = [] }) {
  return {
    id, ownerId, uniqueMapId, name, type, instagram: "", coordinateLat: Number(lat) || 0, coordinateLon: Number(lon) || 0,
    logoBase64: "", description: "", musicStyle: "Mixed", tags, events: [], noctScore: 0, visitors: 0,
    details: { about: "", address, phone: "", website: "", priceLevel: 0, entryFee: "", dressCode: "", minAge: 0, features: [], hours: [], menu: [], acceptsReservations: false, reservationInfo: "" },
    viewCount: 0, checkInTotal: 0, followerCount: 0, checkInHours: {}
  };
}
const PUBLIC_TYPES = ["Stadium", "Arena", "Sports Hall", "Concert Hall", "Theatre Hall", "Opera House", "Open-air Theatre", "Ancient Theatre", "Culture Center", "Museum", "Exhibition Center", "Convention Center", "Shopping Mall", "Square", "Park", "Festival Area", "Public Beach", "Pier & Waterfront", "Event Venue"];
const ROLE_TR = { owner: "Sahip", manager: "Müdür", events: "Etkinlik sorumlusu", staff: "Çalışan" };
const KIND_TR = { event: "Etkinlik", venue: "Mekân", artist: "Sanatçı" };
const untilTs = (days) => Timestamp.fromMillis(Date.now() + days * 864e5);
async function setFeatured(kind, ids, days) {
  const v = days ? untilTs(days) : deleteField();
  if (kind === "event") await updateDoc(doc(db, "businesses", ids.venueId), { ["featuredEvents." + ids.eventId]: v });
  else if (kind === "venue") await updateDoc(doc(db, "businesses", ids.venueId), { featuredUntil: v });
  else await updateDoc(doc(db, "creators", ids.creatorId), { featuredUntil: v });
  // yerel kopyayı güncelle
  const b = ids.venueId && S.biz.find((x) => x.id === ids.venueId);
  if (b && kind === "event") { b.featuredEvents = b.featuredEvents || {}; if (days) b.featuredEvents[ids.eventId] = v; else delete b.featuredEvents[ids.eventId]; }
  if (b && kind === "venue") b.featuredUntil = days ? v : null;
  const c = ids.creatorId && (S.creators || []).find((x) => x.id === ids.creatorId);
  if (c) c.featuredUntil = days ? v : null;
}
const daysSelect = (sel = 7) => `<select class="auto" data-days>${[1, 3, 7, 14, 30].map((d) => `<option value="${d}" ${d === sel ? "selected" : ""}>${d} gün</option>`).join("")}</select>`;
function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function card(parent, html, cls = "") { const d = el(`<div class="card ${cls}">${html}</div>`); parent.appendChild(d); fillUsers(d); return d; }
function empty(parent, text) { parent.insertAdjacentHTML("beforeend", `<div class="empty">${text}</div>`); }

// ================= durum =================
const S = { changes: [], threads: [], page: "overview", biz: [], venueClaims: [], creatorClaims: [], gigs: [], reports: [], banned: [], featureReqs: [], creators: null, bannedSet: new Set() };
const unmanaged = (b) => b.isPublic && !b.ownerId && !Object.keys(b.team || {}).length && !(b.teamIds || []).length;
const PAGES = [
  { g: "Genel", k: "overview", ic: "◎", t: "Genel bakış", v: viewOverview },
  { g: "Onay bekleyenler", k: "claims", ic: "🏠", t: "Mekân başvuruları", n: () => S.venueClaims.length, v: viewClaims },
  { g: "Onay bekleyenler", k: "changes", ic: "📍", t: "Adres değişiklikleri", n: () => S.changes.length, v: viewChanges },
  { g: "Onay bekleyenler", k: "creatorClaims", ic: "🎤", t: "Sanatçı başvuruları", n: () => S.creatorClaims.length, v: viewCreatorClaims },

async function loadCore() {
  const pend = (c) => getDocs(query(collection(db, c), where("status", "==", "pending")));
  const [vc, cc, rp, bn, fr, bz] = await Promise.all([
    pend("venueClaims"), pend("creatorClaims"),
    getDocs(query(collection(db, "reports"), where("status", "==", "open"), limit(200))),
    getDocs(query(collection(db, "banned"), limit(500))),
    pend("featureRequests"),
    getDocs(collection(db, "businesses"))
  ]);
  try { S.changes = docs(await getDocs(query(collection(db, "venueChanges"), where("status", "==", "pending")))); } catch { S.changes = []; }
  try { S.threads = docs(await getDocs(query(collection(db, "support"), orderBy("lastAt", "desc"), limit(150)))); } catch { S.threads = []; }
  const byOld = (a, b) => (toDate(a.createdAt) || 0) - (toDate(b.createdAt) || 0);
  S.venueClaims = docs(vc).sort(byOld);
  S.creatorClaims = docs(cc).sort(byOld);
  S.reports = docs(rp).sort((a, b) => -byOld(a, b));
  S.banned = docs(bn).sort((a, b) => -byOld(a, b));
  S.bannedSet = new Set(S.banned.map((b) => b.id));
  S.featureReqs = docs(fr).sort(byOld);
  S.biz = docs(bz).sort((a, b) => String(a.name).localeCompare(String(b.name), "tr"));
  const um = S.biz.filter(unmanaged).slice(0, 150);
  const gs = await Promise.all(um.map((b) => getDocs(query(collection(db, "businesses", b.id, "gigRequests"), where("status", "==", "pending"))).catch(() => null)));
  S.gigs = gs.flatMap((s) => (s ? docs(s) : [])).sort((a, b) => (toDate(a.startTime) || 0) - (toDate(b.startTime) || 0));
  render();
}
async function loadCreators() {
  if (!S.creators) S.creators = docs(await getDocs(collection(db, "creators"))).sort((a, b) => String(a.name).localeCompare(String(b.name), "tr"));
  return S.creators;
}
const venues = () => S.biz.filter((b) => !b.isPublic);
const publics = () => S.biz.filter((b) => b.isPublic);
function allEvents() {
  const out = [];
  for (const b of S.biz) for (const e of b.events || []) out.push({ ...e, venue: b, featured: isFuture((b.featuredEvents || {})[e.id]) });
  return out;
}

// Hazır metin seçilebilen yazma kutusu
function composer(parent, { title, templates, venue, button, cls = "acc", onSend }) {
  const fill = (t) => t.replaceAll("{v}", venue || "");
  const box = el(`<div class="card" style="background:#fafafc;margin-top:12px">
    <b>${esc(title)}</b>
    <div class="btns" style="margin-top:8px">${templates.map((t, i) => `<button class="b sm" data-t="${i}">${esc(t[0])}</button>`).join("")}</div>
    <textarea style="margin-top:10px;min-height:90px" placeholder="Mesajını yaz ya da hazır metin seç…"></textarea>
    <div class="btns"><button class="b ${cls}" data-a="send">${esc(button)}</button><button class="b" data-a="x">Vazgeç</button>
      <span class="muted">Kullanıcı bunu Ayarlar → Noct'tan mesajlar'da görür.</span></div></div>`);
  const ta = $("textarea", box);
  box.querySelectorAll("[data-t]").forEach((b) => (b.onclick = () => { ta.value = fill(templates[+b.dataset.t][1]); ta.focus(); }));
  if (templates.length) ta.value = fill(templates[0][1]);
  $('[data-a="x"]', box).onclick = () => box.remove();
  $('[data-a="send"]', box).onclick = (e) => guard(e.target, async () => {
    const t = ta.value.trim(); if (!t) throw new Error("Mesaj boş olamaz");
    await onSend(t); box.remove();
  });
  parent.querySelectorAll(".composerbox").forEach((x) => x.remove());
  box.classList.add("composerbox");
  parent.appendChild(box);
  return box;
}

        c.needsDocs = true; render(); toast("Ek belge istendi");
      } });

      onSend: async (t) => { await sendNoct(c.userId, t, { claimId: c.id }); toast("Gönderildi"); } });

async function approveClaim(c) {
  const role = ["owner", "manager", "events", "staff"].includes(c.role) ? c.role : "staff";
  let venueId = c.venueId || "";
  if (!venueId && c.uniqueMapId) {
    const s = await getDocs(query(collection(db, "businesses"), where("uniqueMapId", "==", c.uniqueMapId), limit(1)));
    if (!s.empty) venueId = s.docs[0].id;
  }
  if (!venueId) {
    const id = uuid();
    const d = newBusiness({ id, ownerId: role === "owner" ? c.userId : "", uniqueMapId: c.uniqueMapId || "", name: c.venueName, type: c.venueType || "Venue", lat: c.lat, lon: c.lon, address: c.venueAddress || "" });
    if (role !== "owner") { d.team = { [c.userId]: role }; d.teamIds = [c.userId]; }
    const a = await areaOf(c.lat, c.lon); if (a) Object.assign(d, a);
    await setDoc(doc(db, "businesses", id), d);
    S.biz.push(d);
    venueId = id;
  } else {
    const ref = doc(db, "businesses", venueId);
    const snap = await getDoc(ref);
    const existingOwner = (snap.exists() && snap.data().ownerId) || "";
    const data = { ["teamInvites." + c.userId]: deleteField(), invitedIds: arrayRemove(c.userId) };
    if (role === "owner" && (!existingOwner || existingOwner === c.userId)) {
      data.ownerId = c.userId; data["team." + c.userId] = deleteField(); data.teamIds = arrayRemove(c.userId);
    } else { data["team." + c.userId] = role; data.teamIds = arrayUnion(c.userId); }
    await updateDoc(ref, data);
  }
  await updateDoc(doc(db, "venueClaims", c.id), { status: "approved", venueId, reviewedAt: serverTimestamp() });
  S.venueClaims = S.venueClaims.filter((x) => x.id !== c.id); render();
  notify("claimResult", { col: "venueClaims", id: c.id });
}

async function approveGig(g) {
  const ref = doc(db, "businesses", g.venueId);
  const snap = await getDoc(ref);
  if (!snap.exists()) throw new Error("Yer bulunamadı");
  const events = Array.isArray(snap.data().events) ? snap.data().events.slice() : [];
  const fill = (ev) => {
    ev.title = g.title; ev.desc = g.desc || ""; ev.startTime = g.startTime; ev.endTime = g.endTime;
    for (const k of ["genres", "entryType", "priceText", "category", "artistIds"]) { if (g[k] != null) ev[k] = g[k]; else delete ev[k]; }
    if (g.ticketURL) { ev.ticketURL = g.ticketURL; ev.ticketMode = "external"; } else { delete ev.ticketURL; delete ev.ticketMode; }
  };
  let eventId;
  const i = g.changeOf ? events.findIndex((e) => String(e.id).toUpperCase() === String(g.changeOf).toUpperCase()) : -1;
  if (i >= 0) { const ev = { ...events[i] }; fill(ev); eventId = ev.id; events[i] = ev; }
  else {
    eventId = uuid();
    const ev = { id: eventId, isRecurring: false, lineup: g.creatorName, creatorId: g.creatorId, creatorName: g.creatorName };
    if (g.seriesId) { ev.seriesId = g.seriesId; ev.seriesStopId = g.seriesStopId; ev.seriesTitle = g.seriesTitle; }
    fill(ev); events.push(ev);
  }
  if (g.posterBase64) {
    await setDoc(doc(db, "businesses", g.venueId, "posters", eventId), { img: g.posterBase64 });
    const ev = events.find((e) => e.id === eventId); delete ev.posterBase64; ev.hasPoster = true;
  }
  await updateDoc(ref, { events });
  const b = S.biz.find((x) => x.id === g.venueId); if (b) b.events = events;
  await updateDoc(doc(db, "businesses", g.venueId, "gigRequests", g.id), { status: "approved", decidedAt: serverTimestamp(), eventId });
  if (g.seriesId && g.seriesStopId && !g.changeOf) {
    await updateDoc(doc(db, "series", g.seriesId, "stops", g.seriesStopId), { status: "confirmed", eventId, decidedAt: serverTimestamp() }).catch(() => {});
    notify("seriesStop", { seriesId: g.seriesId, stopId: g.seriesStopId, venueId: g.venueId });
  }
  S.gigs = S.gigs.filter((x) => x.id !== g.id); render();
  notify("gigStatus", { venueId: g.venueId, gigId: g.id });
}

async function banUser(uid, defReason = "") {
  const reason = prompt("Askıya alma sebebi (kullanıcıya gösterilir):", defReason); if (reason === null) return false;
  const u = await userOf(uid);
  await setDoc(doc(db, "banned", uid), { uid, username: (u && u.username) || "", reason: reason.trim().slice(0, 200), createdAt: serverTimestamp() });
  S.banned.unshift({ id: uid, uid, username: (u && u.username) || "", reason, createdAt: Timestamp.now() }); S.bannedSet.add(uid);
  toast("Hesap askıya alındı"); return true;
}
async function unbanUser(uid) {
  await deleteDoc(doc(db, "banned", uid));
  S.banned = S.banned.filter((x) => x.id !== uid); S.bannedSet.delete(uid); toast("Askı kaldırıldı");
}

function eventCard(e, after) {
  const past = !isFuture(e.endTime || e.startTime);
  const d = el(`<div class="card ${e.featured ? "feat" : ""}" style="padding:12px 14px"><div class="row">
      <div class="grow"><div class="title">${esc(e.title)} ${e.isCancelled ? `<span class="chip bad">İptal</span>` : ""}${e.featured ? `<span class="chip p">Öne çıkan · ${daysLeft(e.venue.featuredEvents[e.id])} gün</span>` : ""}${past ? `<span class="chip">Geçmiş</span>` : ""}</div>
      <div class="muted">${fmt(e.startTime)} · <a href="#" data-a="v">${esc(e.venue.name)}</a>${e.category ? " · " + esc(e.category) : ""}${e.lineup ? " · " + esc(e.lineup) : ""}</div>
      <div class="muted">${e.entryType === "free" ? "Ücretsiz" : e.entryType === "paid" ? "Ücretli " + esc(e.priceText || "") : ""}${e.ticketURL ? ` · <a target="_blank" rel="noopener" href="${esc(e.ticketURL)}">Bilet</a>` : ""}</div></div>
    </div>
    <div class="btns">${past ? "" : daysSelect(3) + `<button class="b acc sm" data-a="f">Öne çıkar</button>`}${e.featured ? `<button class="b sm" data-a="uf">Kaldır</button>` : ""}<button class="b bad sm" data-a="del">Etkinliği sil</button></div></div>`);
  $('[data-a="v"]', d).onclick = (x) => { x.preventDefault(); openVenue(e.venue.id); };
  $('[data-a="f"]', d)?.addEventListener("click", (x) => guard(x.target, async () => { await setFeatured("event", { venueId: e.venue.id, eventId: e.id }, Number($("[data-days]", d).value)); toast("Öne çıkarıldı"); after(); }));
  $('[data-a="uf"]', d)?.addEventListener("click", (x) => guard(x.target, async () => { await setFeatured("event", { venueId: e.venue.id, eventId: e.id }, null); toast("Kaldırıldı"); after(); }));
  $('[data-a="del"]', d).onclick = (x) => {
    if (!confirm("“" + e.title + "” etkinliği silinsin mi? Geri alınamaz.")) return;
    guard(x.target, async () => {
      const ref = doc(db, "businesses", e.venue.id);
      const s = await getDoc(ref);
      const events = (s.data().events || []).filter((y) => y.id !== e.id);
      const data = { events };
      if ((s.data().featuredEvents || {})[e.id]) data["featuredEvents." + e.id] = deleteField();
      await updateDoc(ref, data);
      await deleteDoc(doc(db, "businesses", e.venue.id, "posters", e.id)).catch(() => {});
      const b = S.biz.find((y) => y.id === e.venue.id); if (b) b.events = events;
      toast("Etkinlik silindi"); after();
    });
  };
  return d;
}

async function addPlace() {
  const name = $("#nName").value.trim(), type = $("#nType").value;
  const [lat, lon] = $("#nLoc").value.split(",").map((x) => parseFloat(x));
  if (name.length < 2) throw new Error("Ad gerekli");
  if (!isFinite(lat) || !isFinite(lon)) throw new Error("Konumu “enlem, boylam” biçiminde yaz");
  const near = publics().find((p) => Math.hypot((p.coordinateLat - lat) * 111000, (p.coordinateLon - lon) * 111000 * Math.cos(lat * Math.PI / 180)) < 250);
  if (near && !confirm("250 m yakınında “" + near.name + "” zaten var. Yine de eklensin mi?")) return;
  let address = $("#nAddr").value.trim();
  if (!address) { try { const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=tr&lat=${lat}&lon=${lon}`); address = ((await r.json()).display_name || "").split(",").slice(0, 4).join(",").trim(); } catch {} }
  const id = uuid();
  const d = newBusiness({ id, uniqueMapId: `pub_${lat.toFixed(5)}_${lon.toFixed(5)}`, name: name.slice(0, 80), type, lat, lon, address: address.slice(0, 200), tags: type ? [type] : [] });
  d.isPublic = true;
  const a = await areaOf(lat, lon); if (a) Object.assign(d, a);
  await setDoc(doc(db, "businesses", id), d);
  S.biz.push(d); S.biz.sort((x, y) => String(x.name).localeCompare(String(y.name), "tr"));
  toast("Eklendi: " + name); render();
}

// Logo: PNG, SVG, PDF, JPG, WEBP, GIF, AVIF, HEIC (Safari), BMP, ICO… → oranı korunmuş, kenar boşlukları kırpılmış şeffaf PNG
let _pdfjs = null;
async function pdfjs() {
  if (_pdfjs) return _pdfjs;
  await new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"; sc.onload = res; sc.onerror = () => rej(new Error("PDF okuyucu yüklenemedi")); document.head.appendChild(sc); });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  return (_pdfjs = window.pdfjsLib);
}
function loadImg(url) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error("Bu tarayıcı bu dosyayı açamadı. PNG, SVG ya da PDF dene.")); im.src = url; });
}
async function fileToCanvas(file) {
  const name = (file.name || "").toLowerCase(), type = file.type || "";
  if (type === "application/pdf" || name.endsWith(".pdf")) {
    const lib = await pdfjs();
    const pdf = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
    const page = await pdf.getPage(1);
    const v0 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: 1400 / Math.max(v0.width, v0.height) });
    const c = document.createElement("canvas"); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp, background: "rgba(0,0,0,0)" }).promise;
    return c;
  }
  let url;
  if (type === "image/svg+xml" || name.endsWith(".svg")) {
    // Boyutu yazılmamış SVG'ler küçük çizilmesin: viewBox'tan büyük bir boyut ver
    const doc = new DOMParser().parseFromString(await file.text(), "image/svg+xml");
    const svg = doc.documentElement;
    if (!svg || svg.nodeName.toLowerCase() !== "svg") throw new Error("SVG okunamadı");
    const vb = (svg.getAttribute("viewBox") || "").split(/[\s,]+/).map(Number);
    let w = parseFloat(svg.getAttribute("width")) || vb[2] || 1000, h = parseFloat(svg.getAttribute("height")) || vb[3] || 1000;
    const k = 1400 / Math.max(w, h); w *= k; h *= k;
    if (!svg.getAttribute("viewBox") && vb.length < 4) svg.setAttribute("viewBox", `0 0 ${w / k} ${h / k}`);
    svg.setAttribute("width", w); svg.setAttribute("height", h);
    url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], { type: "image/svg+xml" }));
  } else {
    url = URL.createObjectURL(file);
  }
  try {
    const im = await loadImg(url);
    const k = Math.min(1, 1400 / Math.max(im.naturalWidth || im.width, im.naturalHeight || im.height));
    const c = document.createElement("canvas"); c.width = Math.max(1, Math.round((im.naturalWidth || im.width) * k)); c.height = Math.max(1, Math.round((im.naturalHeight || im.height) * k));
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    return c;
  } finally { URL.revokeObjectURL(url); }
}
// Logonun etrafındaki boşluğu kırp (şeffaf ya da düz beyaz zemin): damgada logo halkaya kadar büyüyebilsin
function trimCanvas(c) {
  const ctx = c.getContext("2d"), { width: W, height: H } = c, d = ctx.getImageData(0, 0, W, H).data;
  const at = (x, y) => (y * W + x) * 4;
  const corner = [d[0], d[1], d[2], d[3]];
  const opaqueBg = corner[3] > 250 && corner[0] > 240 && corner[1] > 240 && corner[2] > 240;   // beyaz zeminli logo
  const empty = (i) => d[i + 3] < 12 || (opaqueBg && d[i] > 245 && d[i + 1] > 245 && d[i + 2] > 245);
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (!empty(at(x, y))) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) throw new Error("Logo boş görünüyor");
  const pad = Math.round(Math.max(x1 - x0, y1 - y0) * 0.02);
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(W - 1, x1 + pad); y1 = Math.min(H - 1, y1 + pad);
  const out = document.createElement("canvas"); out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
  out.getContext("2d").drawImage(c, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
  return out;
}
async function readLogo(file) {
  const c = trimCanvas(await fileToCanvas(file));
  for (const side of [640, 512, 400, 320, 256]) {
    const k = Math.min(1, side / Math.max(c.width, c.height));
    const o = document.createElement("canvas"); o.width = Math.max(1, Math.round(c.width * k)); o.height = Math.max(1, Math.round(c.height * k));
    const ctx = o.getContext("2d"); ctx.imageSmoothingQuality = "high"; ctx.drawImage(c, 0, 0, o.width, o.height);
    const b64 = o.toDataURL("image/png").split(",")[1];
    if (b64.length <= 160000) return b64;
  }
  throw new Error("Logo çok karmaşık; daha sade bir dosya dene.");
}

function sealWhy(l) {
  const b = (S.brands || []).find((x) => x.id === l.brandId) || {};
  const why = [];
  if (l.status !== "active") why.push(l.status === "pending" ? "karşı tarafın onayı bekleniyor" : "aktif değil");
  if (!b.verified) why.push("marka doğrulanmamış");
  if (b.status === "suspended") why.push("marka askıda");
  if (!b.logo) why.push("logo yok");
  if (!isFuture(l.endAt)) why.push("bitiş tarihi geçmiş");
  if (!["event", "series"].includes(l.targetType) && isFuture(l.startAt)) why.push("başlangıç: " + fmtDay(l.startAt));
  return why.length ? `<span class="chip warn">Görünmüyor</span> ${esc(why.join(", "))}` : `<span class="chip ok">Görünüyor</span>`;
}

}

    $("#sc").textContent = list.length + " seri";
    const box = $("#sl"); box.innerHTML = "";
    if (!list.length) return empty(box, "Seri yok.");
    for (const s of list) {
      const d = card(box, `<div class="row">${img(s.poster)}<div class="grow"><div class="title">${esc(s.title)} <span class="chip ${s.status === "published" ? "ok" : ""}">${s.status === "published" ? "Yayında" : "Taslak"}</span></div>
        <div class="muted">${esc(s.kind)} · ${esc(s.ownerName || "")} · oluşturan ${uname(s.createdBy)} · ${ago(s.createdAt)}</div><div data-stops class="muted">…</div></div></div>
        <div class="btns">${s.status === "published" ? `<button class="b" data-a="un">Yayından kaldır</button>` : ""}<button class="b bad" data-a="del">Seriyi sil</button></div>`);
      getDocs(collection(db, "series", s.id, "stops")).then((x) => {
        const st = docs(x).sort((a, b) => (toDate(a.startAt) || 0) - (toDate(b.startAt) || 0));
        $("[data-stops]", d).innerHTML = st.map((y) => `${fmtDay(y.startAt)} · ${esc(y.venueName)} (${esc(y.city || "")}${y.countryCode ? " " + esc(y.countryCode) : ""}) · <b>${esc(y.status)}</b>`).join("<br>") || "Durak yok";
      }).catch(() => {});
      $('[data-a="un"]', d)?.addEventListener("click", (e) => guard(e.target, async () => { await updateDoc(doc(db, "series", s.id), { status: "draft" }); s.status = "draft"; draw(); toast("Yayından kaldırıldı"); }));
      $('[data-a="del"]', d).onclick = (e) => {
        if (!confirm("“" + s.title + "” silinsin mi? Mekânların etkinlikleri silinmez.")) return;
        guard(e.target, async () => {
          const x = await getDocs(collection(db, "series", s.id, "stops")); await Promise.all(x.docs.map((y) => deleteDoc(y.ref)));
          await deleteDoc(doc(db, "series", s.id)); S.series = S.series.filter((y) => y.id !== s.id); draw(); toast("Silindi");
        });
      };
    }
  };
  $("#sq").oninput = draw;
  guard(null, async () => { S.series = docs(await getDocs(query(collection(db, "series"), limit(500)))).sort((a, b) => (toDate(b.createdAt) || 0) - (toDate(a.createdAt) || 0)); draw(); });
}
</script>
</body>
</html>
